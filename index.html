  <!-- Self-hosted Plus Jakarta Sans (see assets/site.css). Preloading the latin
       subset avoids a flash of fallback text; it is the only font file
       virtually every visitor needs. -->
  <link rel="preload" as="font" type="font/woff2"
        href="/assets/fonts/plus-jakarta-sans-latin.woff2" crossorigin>
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/site.js" defer></script>

  <style>
    :root {
      --bg-top: #306d8c;
      --bg-bottom: #275973;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.86);
      --giant-title: rgba(255, 255, 255, 0.95);
      --giant-subtitle: rgba(255, 255, 255, 0.75);
      --pill-bg: rgba(0, 0, 0, 0.18);
      --pill-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 35%, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Hero Section */
    .hero-container {
      position: relative;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 3.5rem 4rem 3.5rem;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      min-height: 82vh;
    }

    /* Centered Subject / Character Container */
    .subject-wrapper {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 85%;
      max-height: 720px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }

    .subject-img {
      max-height: 100%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.25));
    }

    /* Massive Typographic Backdrop */
    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 1100px;
    }

    .giant-heading {
      font-size: clamp(2.8rem, 6.2vw, 5.4rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.04em;
      color: var(--giant-title);
      margin-bottom: 1.8rem;
    }

    .giant-heading span.line-1 {
      display: block;
    }

    .giant-heading span.subtitle-line {
      display: block;
      color: var(--giant-subtitle);
      font-weight: 700;
    }

    .hero-bio {
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 520px;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    /* Bottom Pill Buttons */
    .hero-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      row-gap: 0.6rem;
    }

    /* Primary hero CTA */
    .btn-hero-primary {
      background: rgba(255, 255, 255, 0.95);
      color: #111827;
      padding: 0.75rem 1.4rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-hero-primary:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .btn-hero-primary .arrow {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .btn-hero-primary:hover .arrow {
      transform: translateX(3px);
    }

    .btn-secondary {
      background: rgba(0, 0, 0, 0.16);
      border: 1px solid var(--pill-border);
      color: #ffffff;
      padding: 0.75rem 1.4rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.26);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-secondary svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    @media (max-width: 900px) {
      .hero-container {
        padding: 0 1.5rem 3rem 1.5rem;
      }
      /* Size the portrait slot to its content so the empty
         placeholder doesn't reserve blank space and push the
         hero copy and CTAs below the fold. */
      .subject-wrapper {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        height: auto;
        max-height: none;
      }
      .subject-img {
        max-height: 380px;
        margin-bottom: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="site-header">
    <a href="/" class="brand">wing.cx</a>

    <nav class="nav-pill-center">
      <a href="/ships" class="nav-item" data-i18n="nav.ships">Ships</a>
      <a href="/signals" class="nav-item" data-i18n="nav.signals">Signals</a>
    </nav>

    <div class="nav-actions">
      <div class="lang-toggle" role="group" data-i18n-label="lang.label" aria-label="Language">
        <button type="button" class="lang-opt" data-lang="en">EN</button>
        <button type="button" class="lang-opt" data-lang="es">ES</button>
      </div>
    </div>
  </header>

  <!-- Hero Stage -->
  <main class="hero-container">

    <!-- Center Subject Slot -->
    <div class="subject-wrapper">
      <!-- <img src="wing-cutout.png" alt="Daniel Wing" class="subject-img" /> -->
    </div>

    <!-- Massive Text Layout -->
    <div class="hero-content">
      <h1 class="giant-heading">
        <span class="line-1" data-i18n="home.h1.name">Daniel Wing</span>
        <span class="subtitle-line" data-i18n="home.h1.line2">AI & Analytics for</span>
        <span class="subtitle-line" data-i18n="home.h1.line3">Customer Experience</span>
      </h1>

      <p class="hero-bio" data-i18n="home.bio">
        Turning raw user feedback into clean data, and clean data into AI solutions that stick.
      </p>

      <div class="hero-actions">
        <a href="/ships" class="btn-hero-primary"><span data-i18n="home.cta.ships">View my ships</span> <span class="arrow">→</span></a>
        <a href="https://www.linkedin.com/in/daniel-wing" target="_blank" rel="noopener noreferrer" class="btn-secondary">

          <span data-i18n="nav.linkedin">LinkedIn</span>
        </a>
      </div>
    </div>
  </main>

</body>
